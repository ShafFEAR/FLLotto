<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <rect width="800" height="400" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <rect width="800" height="56" fill="#24292f"/>
  <text x="20" y="34" font-size="16" fill="#ffffff">github.com/you/fl-scratch-offs/actions</text>

  <!-- left sidebar: workflow list -->
  <rect x="0" y="56" width="220" height="344" fill="#f6f8fa"/>
  <text x="20" y="86" font-size="12" fill="#57606a" font-weight="600">All workflows</text>
  <rect x="0" y="100" width="220" height="34" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="122" font-size="13" fill="#0969da" font-weight="700">Update scratch-off data</text>
  <text x="230" y="122" font-size="12" fill="#57606a">← click this</text>

  <!-- main panel -->
  <rect x="220" y="56" width="580" height="60" fill="#f6f8fa"/>
  <text x="240" y="92" font-size="15" fill="#1f2328" font-weight="600">Update scratch-off data</text>

  <rect x="640" y="72" width="140" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="655" y="93" font-size="13" fill="#1f2328">Run workflow ▾</text>
  <text x="500" y="93" font-size="12" fill="#57606a">← click, then click the green button that appears</text>

  <!-- run list -->
  <rect x="220" y="140" width="560" height="46" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="245" cy="163" r="8" fill="#1f883d"/>
  <text x="235" y="167" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="265" y="167" font-size="13" fill="#1f2328">Update scratch-off data #1</text>
  <text x="600" y="167" font-size="12" fill="#57606a">completed just now</text>

  <text x="240" y="220" font-size="12" fill="#57606a">A green checkmark means it worked and data.json was created.</text>
</svg>
