<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="800" height="380" fill="#ffffff"/>
  <rect width="800" height="380" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <rect width="800" height="56" fill="#24292f"/>
  <text x="20" y="34" font-size="16" fill="#ffffff">github.com/you/fl-scratch-offs</text>

  <!-- Add file button -->
  <rect x="600" y="80" width="170" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="618" y="102" font-size="13" fill="#1f2328">Add file  ▾</text>
  <text x="560" y="102" font-size="12" fill="#57606a">click, then choose</text>

  <!-- dropdown -->
  <rect x="600" y="118" width="170" height="70" fill="#ffffff" stroke="#d0d7de"/>
  <text x="612" y="140" font-size="13" fill="#1f2328">Create new file</text>
  <rect x="600" y="152" width="170" height="1" fill="#d0d7de"/>
  <text x="612" y="172" font-size="13" fill="#0969da" font-weight="600">Upload files</text>
  <text x="440" y="172" font-size="12" fill="#57606a">← select this</text>

  <!-- drop zone -->
  <rect x="30" y="210" width="740" height="130" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="6,4"/>
  <text x="400" y="265" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Drag files here to add them to your repository</text>
  <text x="400" y="290" font-size="13" fill="#57606a" text-anchor="middle">or choose your files</text>
  <text x="400" y="315" font-size="12" fill="#57606a" text-anchor="middle">scrape.py · index.html · requirements.txt · README.md · .github/workflows/update.yml</text>

  <rect x="30" y="355" width="150" height="0" fill="none"/>
  <text x="30" y="365" font-size="12" fill="#57606a">After uploading, scroll down and click the green "Commit changes" button.</text>
</svg>
