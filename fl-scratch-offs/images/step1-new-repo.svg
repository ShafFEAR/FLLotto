<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="800" height="440" fill="#ffffff"/>
  <rect width="800" height="440" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <!-- top bar -->
  <rect width="800" height="56" fill="#24292f"/>
  <circle cx="30" cy="28" r="12" fill="#ffffff"/>
  <text x="55" y="34" font-size="16" fill="#ffffff">github.com/new</text>

  <text x="30" y="95" font-size="22" fill="#1f2328" font-weight="600">Create a new repository</text>

  <!-- repo name field -->
  <text x="30" y="135" font-size="13" fill="#57606a">Repository name *</text>
  <rect x="30" y="142" width="360" height="36" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="42" y="165" font-size="14" fill="#1f2328">fl-scratch-offs</text>

  <text x="30" y="200" font-size="13" fill="#57606a">Description (optional)</text>
  <rect x="30" y="207" width="500" height="36" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="42" y="230" font-size="14" fill="#8c959f">Florida scratch-off prizes tracker</text>

  <!-- public/private -->
  <circle cx="40" cy="278" r="7" fill="#0969da"/>
  <circle cx="40" cy="278" r="3" fill="#ffffff"/>
  <text x="55" y="283" font-size="14" fill="#1f2328" font-weight="600">Public</text>
  <text x="110" y="283" font-size="12" fill="#57606a">← select this one (needed for free GitHub Pages)</text>

  <circle cx="40" cy="308" r="7" fill="none" stroke="#8c959f" stroke-width="1.5"/>
  <text x="55" y="313" font-size="14" fill="#57606a">Private</text>

  <!-- create button -->
  <rect x="30" y="350" width="180" height="40" rx="6" fill="#1f883d"/>
  <text x="65" y="375" font-size="15" fill="#ffffff" font-weight="600">Create repository</text>

  <text x="230" y="375" font-size="13" fill="#57606a">← click this</text>
</svg>
